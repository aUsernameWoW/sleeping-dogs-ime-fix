# Builds SDIMEFix.asi and runs the automated tests, the way tools\build.ps1 -Test does in the modding
# workspace. The .vcxproj reads its third-party headers from ..\..\reference, so the job recreates that
# layout: this repo in mods\SDIMEFix, ReShade in reference\reshade.
# Every push to main that passes is then published as a prerelease.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The commit reference\reshade is built from, also the key of the reference\ cache. Keep in step with
  # reference\reshade: ReShade only accepts add-ons built against its own ImGui version.
  RESHADE_REF: 18deaa52de0c425a78b329e9cb3c497281cd00ec # v6.8.0

jobs:
  build:
    name: Release x64
    # The image windows-latest points to: Windows Server 2025, Visual Studio 2026 with the project's v143
    # toolset (MSVC 14.44) installed alongside. Named explicitly: plain windows-2025 has been served both
    # VS 2022 and VS 2026 images (actions/runner-images#14004).
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: mods/SDIMEFix
    steps:
      - name: Check out SDIMEFix
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mods/SDIMEFix
          persist-credentials: false

      # reference\ only changes when a pin moves, so a hit skips the checkouts below.
      - name: Restore reference\ from cache
        id: reference
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reference
          key: reference-reshade-${{ env.RESHADE_REF }}

      # The add-on API needs only include\ and the ImGui submodule; blob:none fetches just their files.
      - name: Check out ReShade 6.8.0
        if: steps.reference.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crosire/reshade
          ref: ${{ env.RESHADE_REF }}
          path: reference/reshade
          sparse-checkout: |
            include
            deps/imgui
          filter: blob:none
          persist-credentials: false

      - name: Check out Dear ImGui (the commit ReShade pins)
        if: steps.reference.outputs.cache-hit != 'true'
        working-directory: reference/reshade
        run: git submodule update --init --depth 1 deps/imgui

      # The build is warning-free at /W4 and should stay so, hence -warnAsError (CI only, not build.ps1).
      - name: Build
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          & "$vs\MSBuild\Current\Bin\amd64\MSBuild.exe" SDIMEFix.sln -p:Configuration=Release -p:Platform=x64 -v:m -nologo -warnAsError
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # tests\*.cc are all compiled; *_test.cc run with the .asi path as argv[1] (exit 0 = pass),
      # *_manual.cc need a person (they send real keystrokes).
      - name: Test
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $asi = (Resolve-Path build\Release\SDIMEFix.asi).Path
          $out = (New-Item -ItemType Directory -Force build\tests).FullName
          $failed = @()
          foreach ($src in Get-ChildItem tests -Filter *.cc) {
              Push-Location $out
              cl /nologo /EHsc /W3 /std:c++20 /utf-8 $src.FullName
              $compiled = $LASTEXITCODE -eq 0
              Pop-Location
              if (-not $compiled) { throw "Failed to compile $($src.Name)" }
          }
          foreach ($src in Get-ChildItem tests -Filter *_test.cc) {
              Write-Host "== $($src.BaseName)"
              # Run next to a private copy so the test writes its .ini/.log there, not in build\Release.
              $sandbox = (New-Item -ItemType Directory -Force (Join-Path $out $src.BaseName)).FullName
              Copy-Item $asi $sandbox -Force
              & (Join-Path $out "$($src.BaseName).exe") (Join-Path $sandbox SDIMEFix.asi)
              if ($LASTEXITCODE) { $failed += $src.BaseName }
          }
          if ($failed) { throw "Failed: $($failed -join ', ')" }

      - name: Upload SDIMEFix.asi
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SDIMEFix
          path: |
            mods/SDIMEFix/build/Release/SDIMEFix.asi
            mods/SDIMEFix/build/Release/SDIMEFix.pdb
          if-no-files-found: error

  # Tag build-<N>, N = the commit's position on main (stable across re-runs). The assets keep their plain
  # names so SDIMEFix.asi can go into plugins\ as downloaded.
  prerelease:
    name: Prerelease
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Full history and tags: the build number and the change list since the previous build.
      - name: Check out history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download SDIMEFix.asi
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SDIMEFix
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(git rev-list --count HEAD)
          tag="build-$n"
          short=$(git rev-parse --short HEAD)
          if gh release view "$tag" > /dev/null 2>&1; then
            # A re-run of the same commit refreshes the assets; the same number on another commit means
            # main was rewritten, which needs a person to sort out.
            if [ "$(git rev-list -n 1 "refs/tags/$tag")" != "$GITHUB_SHA" ]; then
              echo "::error::$tag already exists for another commit"
              exit 1
            fi
            gh release upload "$tag" dist/SDIMEFix.asi dist/SDIMEFix.pdb THIRD-PARTY-NOTICES.md --clobber
            exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'build-*' HEAD 2> /dev/null || true)
          {
            echo "Automatic build of $short on \`main\` ([CI run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Untested in game."
            echo
            echo "Copy \`SDIMEFix.asi\` into the game's \`plugins\` folder. \`SDIMEFix.pdb\` is only needed to read crash dumps."
            echo
            if [ -n "$prev" ]; then
              echo "Changes since $prev:"
              git log --format='- %s (%h)' "$prev..HEAD"
            else
              echo "Recent changes:"
              git log -n 10 --format='- %s (%h)'
            fi
          } > notes.md
          gh release create "$tag" dist/SDIMEFix.asi dist/SDIMEFix.pdb THIRD-PARTY-NOTICES.md --prerelease --target "$GITHUB_SHA" \
            --title "SDIMEFix build $n ($short)" --notes-file notes.md

  # Each new prerelease also becomes the latest version of the mod's main file on Nexus Mods, through the v3
  # upload API. Configured per repository, so the job is the same in every mod:
  #   vars.NEXUS_MOD_ID, vars.NEXUS_FILE_ID  the v3 IDs of the mod and of its main file (the update chain, not
  #                                          one upload): Files tab of the mod page -> the file -> "Advanced"
  #   secrets.NEXUSMODS_API_KEY              a personal API key (nexusmods.com/settings/api-keys)
  # Without NEXUS_FILE_ID the job is skipped.
  nexus:
    name: Nexus Mods
    needs: prerelease
    if: vars.NEXUS_FILE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXUS_API: https://api.nexusmods.com/v3
      NEXUS_MOD_ID: ${{ vars.NEXUS_MOD_ID }}
      NEXUS_FILE_ID: ${{ vars.NEXUS_FILE_ID }}
    steps:
      # Full history and tags: the build number and the change list since the version Nexus has.
      - name: Check out history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download SDIMEFix.asi
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SDIMEFix
          path: dist

      # Nexus keeps every upload as a new version, so a re-run of a build it already has uploads nothing.
      # The zip unpacks into the game folder. The .pdb stays on the GitHub prerelease of the same build.
      - name: Package
        id: package
        env:
          NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$NEXUSMODS_API_KEY" ]; then
            echo "::error::vars.NEXUS_FILE_ID is set but secrets.NEXUSMODS_API_KEY is not"
            exit 1
          fi
          n=$(git rev-list --count HEAD)
          version="build-$n"
          short=$(git rev-parse --short HEAD)
          curl -fsS --retry 3 -H "apikey: $NEXUSMODS_API_KEY" -H "User-Agent: $GITHUB_REPOSITORY" \
            "$NEXUS_API/mod-files/$NEXUS_FILE_ID/versions" > versions.json
          if jq -e --arg v "$version" 'any(.data.versions[]; .version == $v)' versions.json > /dev/null; then
            echo "::notice::Nexus Mods already has $version"
            exit 0
          fi
          latest=$(jq -r '.data.versions | max_by(.uploaded_at) | .version // empty' versions.json)

          mkdir -p package/plugins
          cp dist/SDIMEFix.asi package/plugins/
          cp THIRD-PARTY-NOTICES.md package/plugins/SDIMEFix-THIRD-PARTY-NOTICES.md
          (cd package && zip -r -X "../SDIMEFix-$version.zip" plugins)

          # Changes since the version Nexus has, or since the previous build if that is not a build tag.
          if git rev-parse -q --verify "refs/tags/$latest" > /dev/null; then
            since=$latest
          else
            since=$(git describe --tags --abbrev=0 --match 'build-*' HEAD^ 2> /dev/null || true)
          fi
          {
            echo "version=$version"
            echo "name=SDIMEFix GitHub CI Build $n"
            echo "description=Automatic build of $short on main, untested in game. Unpack into the game folder (puts SDIMEFix.asi into plugins). Source and .pdb: https://github.com/$GITHUB_REPOSITORY/releases/tag/$version"
            delimiter="EOF_$(openssl rand -hex 8)"
            echo "changelog<<$delimiter"
            if [ -n "$since" ]; then git log --format='%s' "$since..HEAD"; else git log -n 10 --format='%s'; fi
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "upload=true" >> "$GITHUB_OUTPUT"

      # The previous version moves to the file's archive; the mod's version shown on the page follows.
      - name: Upload to Nexus Mods
        if: steps.package.outputs.upload == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          mod_id: ${{ vars.NEXUS_MOD_ID }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: SDIMEFix-${{ steps.package.outputs.version }}.zip
          version: ${{ steps.package.outputs.version }}
          display_name: ${{ steps.package.outputs.name }}
          description: ${{ steps.package.outputs.description }}
          changelog: ${{ steps.package.outputs.changelog }}
          archive_existing_version: true
          update_mod_version: true
